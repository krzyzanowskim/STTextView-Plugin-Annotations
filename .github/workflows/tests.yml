name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1'
      - run: swift test --parallel

  # The suite itself is macOS only so far, so this job builds the package and the
  # test bundle for iOS and launches them on a simulator.
  test-ios:
    name: Build iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1'
      - name: Build and run the test bundle
        run: |
          # Any available iOS simulator will do; names differ between runner images.
          UDID=$(xcrun simctl list devices available --json |
                 jq -r '.devices | to_entries | map(select(.key | test("iOS"))) | .[].value[] | .udid' |
                 head -1)
          test -n "$UDID" || { echo "no iOS simulator available"; exit 1; }
          xcodebuild test -scheme STAnnotationsPluginTests -destination "id=$UDID"
