name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1'
      - run: swift test --parallel

  # The suite itself is macOS only so far, so this job builds the package and the
  # test bundle for iOS and launches them on a simulator.
  test-ios:
    name: Build iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1'
      - name: Build and run the test bundle
        run: |
          # Any available iOS simulator will do; names differ between runner images.
          UDID=$(xcrun simctl list devices available |
                 awk '/^-- iOS /{ios=1; next} /^-- /{ios=0} ios && match($0, /[0-9A-F-]{36}/) {print substr($0, RSTART, RLENGTH); exit}')
          test -n "$UDID" || { xcrun simctl list devices available; echo "no iOS simulator available"; exit 1; }
          echo "Testing on $UDID"
          xcodebuild test -scheme STAnnotationsPluginTests -destination "id=$UDID"
